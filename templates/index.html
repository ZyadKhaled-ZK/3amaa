<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاستعلام عن نتيجة الثانوية العامة 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 900px; width: 100%; margin-top: 30px; }
        h1 { text-align: center; font-size: 28px; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 30px; font-size: 14px; }
        .search-box {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .form-row { display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 150px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #ccc; }
        input, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        input:focus, select:focus { border-color: #6c63ff; box-shadow: 0 0 0 3px rgba(108,99,255,0.3); }
        input::placeholder { color: #777; }
        select option { background: #302b63; color: #fff; }
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6c63ff, #e040fb);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,99,255,0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .results-section { margin-top: 30px; display: none; }
        .results-section.visible { display: block; }
        .results-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px;
            background: rgba(255,255,255,0.06);
            border-radius: 12px 12px 0 0;
            border: 1px solid rgba(255,255,255,0.1);
            border-bottom: none;
        }
        .results-count { color: #aaa; font-size: 14px; }
        .results-count span { color: #e040fb; font-weight: bold; }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255,255,255,0.04);
            border-radius: 0 0 12px 12px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .results-table th {
            background: rgba(108,99,255,0.2);
            padding: 14px 16px;
            text-align: center;
            font-size: 14px;
            color: #ccc;
        }
        .results-table td {
            padding: 12px 16px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }
        .results-table tr:hover td { background: rgba(255,255,255,0.04); }
        .status-pass { color: #4caf50; font-weight: bold; }
        .status-fail { color: #f44336; font-weight: bold; }

        .error {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(244,67,54,0.15);
            border: 1px solid rgba(244,67,54,0.3);
            color: #f44336;
            text-align: center;
            display: none;
        }
        .error.visible { display: block; }

        .loading { text-align: center; margin-top: 20px; display: none; }
        .loading.visible { display: block; }
        .spinner {
            display: inline-block;
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #6c63ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
            margin-top: 30px;
            padding: 20px;
            text-align: center;
            color: #555;
            font-size: 13px;
            border-top: 1px solid rgba(255,255,255,0.05);
            line-height: 2;
        }
        .footer a { color: #6c63ff; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        .hint { text-align: center; color: #666; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>نتيجة الثانوية العامة 2026</h1>
        <p class="subtitle">الاستعلام عن نتيجة الدور الأول - نظام حديث</p>

        <div class="search-box">
            <form id="searchForm">
                <div class="form-row">
                    <div class="form-group" style="flex:0 0 160px">
                        <label for="searchBy">البحث بـ</label>
                        <select id="searchBy">
                            <option value="seating_no">رقم الجلوس</option>
                            <option value="name">الاسم</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1">
                        <label for="query">أدخل رقم الجلوس أو الاسم</label>
                        <input type="text" id="query" placeholder="مثال: 2001970" autocomplete="off">
                    </div>
                    <button type="submit" id="searchBtn">بحث</button>
                </div>
            </form>
            <p class="hint">يمكنك البحث برقم الجلوس (مطابقة تامة) أو بالاسم (جزء من الاسم)</p>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top:10px;color:#aaa;">جارٍ البحث...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <div class="results-count">عدد النتائج: <span id="resultCount">0</span></div>
            </div>
            <table class="results-table">
                <thead>
                    <tr>
                        <th>م</th>
                        <th>رقم الجلوس</th>
                        <th>الاسم</th>
                        <th>المجموع</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>

        <div class="footer">
            <b>زياد خالد</b> &copy; 2026<br>
            <a href="https://github.com/ZyadKhaled-ZK">GitHub: ZyadKhaled-ZK</a><br>
            zezomx01@gmail.com
        </div>
    </div>

    <script>
        const searchForm = document.getElementById('searchForm');
        const queryInput = document.getElementById('query');
        const searchBy = document.getElementById('searchBy');
        const searchBtn = document.getElementById('searchBtn');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const resultsSection = document.getElementById('resultsSection');
        const resultsBody = document.getElementById('resultsBody');
        const resultCount = document.getElementById('resultCount');

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = queryInput.value.trim();
            if (!query) return;

            resultsSection.classList.remove('visible');
            errorDiv.classList.remove('visible');
            loading.classList.add('visible');
            searchBtn.disabled = true;

            try {
                const res = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, searchBy: searchBy.value })
                });
                const data = await res.json();

                if (data.error) {
                    errorDiv.textContent = data.error;
                    errorDiv.classList.add('visible');
                    return;
                }

                resultCount.textContent = data.count;
                resultsBody.innerHTML = data.results.map((r, i) => {
                    const statusClass = r.student_case_desc && r.student_case_desc.includes('ناجح') ? 'status-pass' : 'status-fail';
                    return `<tr>
                        <td>${i + 1}</td>
                        <td>${r.seating_no}</td>
                        <td>${r.arabic_name}</td>
                        <td>${r.total_degree}</td>
                        <td class="${statusClass}">${r.student_case_desc}</td>
                    </tr>`;
                }).join('');
                resultsSection.classList.add('visible');
            } catch (err) {
                errorDiv.textContent = 'حدث خطأ في الاتصال بالخادم';
                errorDiv.classList.add('visible');
            } finally {
                loading.classList.remove('visible');
                searchBtn.disabled = false;
            }
        });

        document.getElementById('searchBy').addEventListener('change', function() {
            const input = document.getElementById('query');
            input.placeholder = this.value === 'seating_no' ? 'مثال: 2001970' : 'مثال: أحمد محمود';
            input.value = '';
            resultsSection.classList.remove('visible');
            errorDiv.classList.remove('visible');
        });
    </script>
</body>
</html>
